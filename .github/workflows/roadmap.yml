name: roadmap
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roadmap
jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/roadmap.mjs
      - name: Commitear avances regenerados
        run: |
          if ! git diff --quiet docs/ROADMAP.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/ROADMAP.md
            git commit -m "docs(roadmap): regenerar avances [skip ci]"
            git push
          fi
