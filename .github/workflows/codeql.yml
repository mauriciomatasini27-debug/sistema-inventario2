name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      # Code scanning is not enabled on this private repo (needs GitHub Advanced Security),
      # so analyze locally and keep the SARIF as an artifact instead of uploading.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-results
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
