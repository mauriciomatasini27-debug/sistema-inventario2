name: CodeQL
on:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      # Code scanning is not enabled on this private repo (needs GitHub Advanced Security),
      # so analyze locally and keep the SARIF as an artifact instead of uploading.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: sarif-results
      - uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: sarif-results
